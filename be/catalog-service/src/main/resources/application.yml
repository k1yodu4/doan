spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bao_shop}?currentSchema=${DB_SCHEMA:catalog}
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD:gbao4132}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:catalog}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: catalog
    default-schema: catalog
    validate-on-migrate: false

logging:
  level:
    org.flywaydb: DEBUG

server:
  port: ${SERVER_PORT:8082}